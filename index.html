<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>accuCad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; color: #c9d1d9; font-family: monospace; }
    #app-container { width: 100%; height: 100%; position: relative; }
  </style>
  <script src="/Library/LunoLoader.js"></script>
</head>
<body>
  <div id="app-container"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof LunoLoader !== "undefined") {
        LunoLoader.loadApp("app-container");
      }
    });
  </script>
</body>
</html>
